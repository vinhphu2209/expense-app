name: Task
description: A planned unit of work (one issue = one branch = one PR)
title: "[P_-__] "
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        Title format: `[<plan-id>] <short imperative description>` — see docs/conventions/issues.md.
        Add one `area:` and one `agent:` label and a milestone before moving the card to **Ready**.
  - type: input
    id: plan_id
    attributes:
      label: Plan ID
      description: ID from docs/plan.md §6, or "—" if not in the plan yet.
      placeholder: P1-03
    validations:
      required: true
  - type: dropdown
    id: owner
    attributes:
      label: Owner
      options:
        - claude-code
        - antigravity
        - human
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What and why, in 1–3 sentences.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Copy from docs/plan.md §6 and make each item testable.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      placeholder: |
        Blocked by #
        Blocks #
  - type: textarea
    id: notes
    attributes:
      label: Notes / references
      description: Links to PLAN sections, ADRs, designs.
