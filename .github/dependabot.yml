version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      # Dependabot adds the colon; scope is fixed to `deps` (commitlint has no `deps-dev`).
      # It capitalizes "Bump", so commitlint.config.mjs ignores exactly these generated headers.
      prefix: "build(deps)"
      prefix-development: "build(deps)"
    labels: ["type:chore", "area:ci"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    labels: ["type:chore", "area:ci"]
